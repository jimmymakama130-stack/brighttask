<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Referrals — Taskbright</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="navbar dashboard-nav">

  <a href="/dashboard.html" class="logo">
    Task<span>bright</span>
  </a>

</header>

<main class="dashboard">

  <section class="welcome">

    <div>
      <p>Invite and earn</p>
      <h1>My Referrals</h1>
    </div>

  </section>

  <section class="referral-hero">

    <div class="referral-icon">
      ₦100
    </div>

    <h2>Earn ₦100</h2>

    <p>
      You receive ₦100 when a person you refer activates their
      Taskbright account.
    </p>

  </section>

  <section class="referral-link-card">

    <span>Your Referral Link</span>

    <div class="referral-link-box">

      <input
        type="text"
        value="https://taskbright.com/register?ref=YOURCODE"
        readonly
      >

      <button type="button">
        Copy
      </button>

    </div>

  </section>

  <section class="referral-stats">

    <div>
      <span>Total Referrals</span>
      <strong>0</strong>
    </div>

    <div>
      <span>Activated</span>
      <strong>0</strong>
    </div>

    <div>
      <span>Referral Earnings</span>
      <strong>₦0</strong>
    </div>

  </section>

</main>

</body>
</html>
