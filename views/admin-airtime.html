<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Airtime — Taskbright</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="navbar dashboard-nav">

  <a href="/admin-dashboard.html" class="logo">
    Task<span>bright</span>
  </a>

  <div class="admin-badge">ADMIN</div>

</header>

<main class="dashboard">

  <a href="/admin-dashboard.html" class="back-link">
    ← Admin Dashboard
  </a>

  <section class="welcome">
    <div>
      <p>Service management</p>
      <h1>Airtime Requests</h1>
    </div>
  </section>

  <div class="admin-warning">
    🔐 <strong>Admin approval required:</strong>
    Airtime purchases must be reviewed before the user's wallet is

  </div>

  <section class="admin-request-list">

    <div class="empty-tasks">
      <div class="empty-icon">📱</div>
      <h2>No pending airtime requests</h2>
      <p>New user airtime requests will appear here for review.</p>
    </div>

  </section>
